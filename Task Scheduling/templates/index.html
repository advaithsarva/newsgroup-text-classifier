<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Include Google Fonts (Poppins font for title) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Background gradient for the body */
        .bg-gradient {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Poppins', sans-serif; /* Use Poppins font for all text */
            color: #fff;
        }

        /* Main layout container */
        .main-layout {
            gap: 15px;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar container */
        .sidebar-container {
            width: 25%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Sidebar container boxes */
        .container-box {
            flex: 1;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* Box styles */
        .box-1 {
            background-color: #ff8c00; /* Orange */
            height: 150px;
            flex-grow: 1;
            margin-right: 10px;
        }

        .box-2 {
            background-color: #4a148c; /* Darker Purple for contrast */
            height: 150px;
            flex-grow: 1;
            margin-bottom: 10px; /* Adding space between the top two boxes */
        }

        .box-3 {
            background-color: #2575fc; /* Blue */
            margin-top: 10px;
            height: 250px;
        }

        /* Center container for file upload */
        .upload-section {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Upload container styling */
        .upload-container {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
        }

        /* Title and icon styling */
        .title-container {
            display: flex;
            justify-content: flex-start; /* Align title and icon to the left */
            align-items: center;
            margin-bottom: 40px;
        }

        .brain-icon {
            margin-left: 10px;
            width: 50px;
            height: auto;
            border-radius: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #f8f9fa;
            margin-left: 20px; /* Space between the icon and title */
            font-weight: 600; /* Slightly bolder title */
        }

        /* Heading styling for upload */
        h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #f8f9fa;
        }

        /* Styling for file input and button */
        input[type="file"] {
            border: none;
            padding: 8px;
            border-radius: 8px;
            background-color: #f1f1f1;
            color: #333;
            cursor: pointer;
        }

        /* Reverting the upload button to its previous state */
        button {
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            background-color: #ff8c00;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff6400;
        }

        /* Success and error messages */
        .message {
            margin-top: 15px;
            font-size: 0.9em;
            font-weight: bold;
            display: none;
        }

        .message.success {
            color: #4caf50;
        }

        .message.error {
            color: #f44336;
        }

        /* Right container styling */
        .right-container {
            width: 30%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); /* Gradient background for contrast */
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;  /* Stack the buttons vertically */
            justify-content: space-between; /* Evenly space the buttons across the container height */
            height: 100%; /* Make sure the container takes the full height */
            align-items: flex-start; /* Align buttons to the left */
            gap: 15px;
        }

        /* New circular button styles */
        .btn-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Evenly space buttons */
            height: 100%; /* Let the container take the full height */
            gap: 15px;
        }

        .btn {
            width: 25px; 
            height: 25px; 
            background: linear-gradient(to bottom, #ff8c00 0%, #ff6400 100%);
            color: white;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center; /* Ensure text is centered inside the button */
            line-height: 40px; /* Vertically center the text */
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #ff6400 0%, #ff8c00 100%);
            transform: scale(1.1); /* Slightly increased scaling effect */
        }
    </style>
</head>
<body class="bg-gradient">

    <!-- Main container that aligns all elements in a flex layout -->
    <div class="container-fluid d-flex vh-100 main-layout p-4">
        
        <!-- Left sidebar with three containers of different heights -->
        <div class="d-flex flex-column sidebar-container p-3">
            <div class="d-flex flex-row mb-3">
                <div class="container-box box-1">
                    <p class="rag-text">Model-generated text for box 1</p>
                </div>
                <div class="container-box box-2">
                    <p class="rag-text">Model-generated text for box 2</p>
                </div>
            </div>
            <div class="container-box box-3">
                <p class="rag-text">Model-generated text for box 3</p>
            </div>
        </div>

        <!-- Main upload container centered in the middle of the page -->
        <div class="upload-section d-flex align-items-center justify-content-center flex-column">
            <!-- Title with brain icon -->
            <div class="title-container d-flex align-items-center justify-content-start mb-5">
                <h1 class="ml-3">Second Brain</h1>
                <img src="https://res.cloudinary.com/daiw2mcvd/image/upload/v1731521060/Screenshot_2024-11-13_233313_ufmsik.png" alt="Brain Icon" class="brain-icon">
            </div>
            <div class="upload-container text-center">
                <h2>Upload Your File</h2>
                <form id="file-upload-form">
                    <label for="file-input">Choose a file:</label>
                    <input type="file" id="file-input" class="form-control mb-3" />
                    <button type="submit">Upload</button>
                    <p class="message success" id="success-message">File successfully uploaded!</p>
                    <p class="message error" id="error-message">File upload failed. Please try again.</p>
                </form>
            </div>
        </div>

        <!-- Right side large container with circular buttons -->
        <div class="right-container d-flex flex-column justify-content-between p-3">
            <!-- Adding six circular buttons -->
            <div class="btn-container">
                <a href="#" class="btn btn-circle"></a>
                <a href="#" class="btn btn-circle"></a>
                <a href="#" class="btn btn-circle"></a>
                <a href="#" class="btn btn-circle"></a>
                <a href="#" class="btn btn-circle"></a>
                <a href="#" class="btn btn-circle"></a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</body>
</html>
