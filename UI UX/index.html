<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loki Series Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timeline-container">
        <div class="timeline">
            <div class="event event-1">
                <span class="dot"></span>
                <div class="event-text">Event 1</div>
            </div>
            <div class="event event-2">
                <span class="dot"></span>
                <div class="event-text">Event 2</div>
            </div>
            <div class="event event-3">
                <span class="dot"></span>
                <div class="event-text">Event 3</div>
            </div>
        </div>
        <!-- Branching Timeline -->
        <div class="timeline branching">
            <div class="event branching-event">
                <span class="dot"></span>
                <div class="event-text">Alternate Timeline</div>
            </div>
        </div>
    </div>
</body>
</html>
